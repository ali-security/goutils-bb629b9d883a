language: go

go:
  - 1.6
  - 1.7
  - 1.8
  - 1.11

go_import_path: github.com/Masterminds/goutils

before_install:
  - if ! go version | grep -q "go${TRAVIS_GO_VERSION} "; then curl -sSfL "https://dl.google.com/go/go${TRAVIS_GO_VERSION}.linux-amd64.tar.gz" | tar -C "$HOME" -xz && export GOROOT="$HOME/go" && export PATH="$GOROOT/bin:$PATH"; fi
  - go version

install:
  - go build -v .

script:
  - go test -v
